name: Tests

# courier is the lab's shared email relay, and its first hard rule is that it
# must never become an open relay. That guard has had unit tests since the
# service was written, and until now this repo had no workflows at all — so
# nothing ever ran them. "There are tests for the allowlist" was true and
# bought nothing.
#
# Path-filtered so documentation and Bicep changes don't pay for a Python run:
# this repo is private, so its minutes come out of the monthly allowance.

on:
  push:
    branches: [master, main]
    paths:
      - "app/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the Flex Consumption runtime pinned in
          # infrastructure/main.bicep. Testing on a version production does not
          # run is a check that can pass while the deployed code fails.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Run tests
        run: python -m pytest app/tests -q
